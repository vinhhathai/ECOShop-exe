    <script>
        // Kiểm tra nếu URL là trang chủ
        const currentUrl = window.location.pathname;
        const homeLink = document.getElementById("home-link");
        if (currentUrl === "/" || currentUrl === "/home-page.html") {
            homeLink.classList.add("animate-target");
        }

        // JavaScript để thêm class khi một mục được chọn
        document.querySelectorAll('.navbar-nav .nav-link').forEach(link => {
            link.addEventListener('click', function () {
                // Xóa class `active-link` khỏi tất cả các mục
                document.querySelectorAll('.navbar-nav .nav-link').forEach(item => item.classList.remove('active-link'));

                // Thêm class `active-link` vào mục hiện tại
                this.classList.add('active-link');
            });
        });

        // Thêm target="_parent" vào tất cả các thẻ a
        document.querySelectorAll('a').forEach(link => {
            link.setAttribute('target', '_parent');
        });

        //search
        document.addEventListener("DOMContentLoaded", function () {
            const searchToggleBtn = document.getElementById("search-toggle-btn");
            const searchBarContainer = document.querySelector(".search-bar-container");

            searchToggleBtn.addEventListener("click", function () {
                searchBarContainer.classList.toggle("show-search");
            });
        });



    </script>

    <style>
        /* Giữ trạng thái hover cho animate-target */
        /* CSS chung cho các mục khi được chọn */

            border-bottom: 2px solid #007bff;

        }

    <script>
        const logoutBtn = document.getElementById('logout-btn');

        // Hàm xóa tất cả cookie
        function clearAllCookies() {
            document.cookie.split(";").forEach((cookie) => {
                const eqPos = cookie.indexOf("=");
                const name = eqPos > -1 ? cookie.substring(0, eqPos) : cookie;
                document.cookie = name + "=;expires=Thu, 01 Jan 1970 00:00:00 UTC;path=/;";
            });
        }

        // Sự kiện đăng xuất
        logoutBtn.addEventListener('click', (event) => {
            event.preventDefault();
            alert('Đăng xuất thành công!');

            // Xóa cookie
            clearAllCookies();

            // Chuyển hướng về trang đăng nhập
            window.location.href = '/view/sign-in-page.html';
        });
    </script>
