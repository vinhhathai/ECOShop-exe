<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Tin tức & Sự kiện</title>
    <link rel="stylesheet" href="../assets/vendor/swiper/swiper-bundle.min.css">
    <link rel="stylesheet" href="../assets/vendor/simplebar/simplebar.min.css">
    <link rel="stylesheet" href="../assets/css/theme.min.css">
</head>

<body>
    <!-- Header -->
    <iframe src="../components/header.html" scrolling="no" style="overflow: hidden;" target="_parent"></iframe>

    <!-- Page content -->
    <main class="content-wrapper container my-5">
        <div class="row">
            <!-- Sidebar for Categories -->
            <aside class="col-md-3">
                <div class="list-group">
                    <a href="#" class="list-group-item list-group-item-action active">Tin tức</a>
                    <a href="#" class="list-group-item list-group-item-action">Sự kiện nổi bật</a>
                    <a href="#" class="list-group-item list-group-item-action">Hoạt động cộng đồng</a>
                </div>
            </aside>

            <!-- News & Events Listing -->
            <section class="col-md-9">
                <div class="row">
                    <!-- Sample News/Event Card -->
                    <div class="col-md-12 mb-4">
                        <div class="card">
                            <img src="../assets/images/news1.jpg" class="card-img-top" alt="News 1">
                            <div class="card-body">
                                <h5 class="card-title">Tiêu đề Tin tức 1</h5>
                                <p class="card-text">Tóm tắt tin tức 1...</p>
                                <a href="#" class="btn btn-primary">Đọc thêm</a>
                            </div>
                            <div class="card-footer text-muted">
                                Ngày đăng: 25/10/2024
                            </div>
                        </div>
                    </div>
                    <div class="col-md-12 mb-4">
                        <div class="card">
                            <img src="../assets/images/event1.jpg" class="card-img-top" alt="Event 1">
                            <div class="card-body">
                                <h5 class="card-title">Tiêu đề Sự kiện 1</h5>
                                <p class="card-text">Mô tả ngắn về sự kiện 1...</p>
                                <a href="#" class="btn btn-primary">Chi tiết sự kiện</a>
                            </div>
                            <div class="card-footer text-muted">
                                Ngày tổ chức: 30/10/2024
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- Footer -->
    <iframe id="footerIframe" src="../components/footer.html" scrolling="no" style="width: 100%; border: none;" target="_parent"></iframe>

    <script>
        function resizeIframe() {
            const iframe = document.getElementById("footerIframe");
            iframe.style.height = iframe.contentWindow.document.body.scrollHeight + "px";
        }

        document.getElementById("footerIframe").onload = resizeIframe;
    </script>

    <!-- Vendor scripts -->
    <script src="../assets/vendor/swiper/swiper-bundle.min.js"></script>
    <script src="../assets/vendor/simplebar/simplebar.min.js"></script>

    <!-- Bootstrap + Theme scripts -->
    <script src="../assets/js/theme.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
