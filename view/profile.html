<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <style>
        .profile-container {
            max-width: 500px;
            margin: 50px auto;
        }
        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
        }
        .profile-info label {
            font-weight: bold;
        }
        .edit-btn {
            text-align: right;
        }
    </style>
</head>
<body>

    <div class="container profile-container">
        
        <div class="card p-4">
            <div class="text-center mb-4">
                <img src="avatar-placeholder.png" alt="Avatar" class="profile-avatar">
                <h3 class="mt-3">Tên Người Dùng</h3>
            </div>
            <form class="profile-info">
                <div class="mb-3">
                    <label>Email:</label>
                    <input type="email" class="form-control" value="user@example.com" readonly>
                </div>
                <div class="mb-3">
                    <label>Tên:</label>
                    <input type="text" class="form-control" value="Tên Người Dùng" readonly>
                </div>
                <div class="mb-3">
                    <label>Mật khẩu:</label>
                    <input type="password" class="form-control" value="password" readonly>
                </div>
                <div class="mb-3">
                    <label>Địa chỉ:</label>
                    <input type="text" class="form-control" value="123 Đường ABC, Thành phố XYZ" readonly>
                </div>
                <div class="edit-btn">
                    <button type="button" class="btn btn-primary">Chỉnh sửa</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
