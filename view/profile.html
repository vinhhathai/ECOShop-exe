<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <style>
        body {
            background-image: url('../assets/img/home/fashion/v2/hero/image.png');
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-position: center;
        }
        .profile-container {
            max-width: 500px;
            margin: 50px auto;
            background-color: rgba(255, 255, 255, 0.8); /* Làm mờ nền của container */
            border-radius: 8px;
            padding: 20px;
        }
        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
        }
        .profile-info label {
            font-weight: bold;
        }
        .edit-btn {
            text-align: right;
        }
    </style>
</head>
<body>

    <div class="container profile-container">
        <div class="card p-4">
            <div class="text-center mb-4">
                <img src="avatar-placeholder.png" alt="Avatar" class="profile-avatar">
                <h3 class="mt-3">Tên Người Dùng</h3>
            </div>
            <form class="profile-info">
                <div class="mb-3">
                    <label>Email:</label>
                    <input type="email" class="form-control" value="user@example.com" readonly>
                </div>
                <div class="mb-3">
                    <label>Tên:</label>
                    <input type="text" class="form-control" value="Tên Người Dùng" readonly>
                </div>
                <div class="mb-3">
                    <label>Mật khẩu:</label>
                    <input type="password" class="form-control" value="password" readonly>
                </div>
                <div class="mb-3">
                    <label>Địa chỉ:</label>
                    <input type="text" class="form-control" value="123 Đường ABC, Thành phố XYZ" readonly>
                </div>
                <div class="edit-btn">
                    <button type="button" class="btn btn-primary" id="editButton" onclick="toggleEdit()">Chỉnh sửa</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script>
        function toggleEdit() {
            const formFields = document.querySelectorAll('.profile-info input');
            const editButton = document.getElementById('editButton');

            if (editButton.textContent === 'Chỉnh sửa') {
                formFields.forEach(field => field.removeAttribute('readonly'));
                editButton.textContent = 'Lưu';
            } else {
                formFields.forEach(field => field.setAttribute('readonly', true));
                editButton.textContent = 'Chỉnh sửa';
                // Thêm mã để xử lý lưu thông tin ở đây nếu cần
            }
        }
    </script>
</body>
</html>
